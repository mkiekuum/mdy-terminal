name: Portable release checks
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, archive: win-x64.zip}
          - {os: windows-11-arm, archive: win-arm64.zip}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/package-portable.py ${{ matrix.archive }}
      - run: python tools/test-portable.py (Get-Item dist/mdy-terminal-v*-*.zip).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: dist/mdy-terminal-v*-*.zip
          if-no-files-found: error
