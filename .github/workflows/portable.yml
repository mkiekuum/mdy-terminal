name: Portable release checks
on:
  push:
    branches: ['release/v5.0.0','release/v5.1.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, archive: win-x64.zip}
          - {os: windows-11-arm, archive: win-arm64.zip}
          - {os: macos-15-intel, archive: darwin-x64.tar.gz}
          - {os: macos-15, archive: darwin-arm64.tar.gz}
          - {os: ubuntu-latest, archive: linux-x64.tar.xz}
          - {os: ubuntu-24.04-arm, archive: linux-arm64.tar.xz}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/package-portable.py ${{ matrix.archive }}
      - shell: bash
        run: python tools/test-portable.py dist/mdy-terminal-v*-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: dist/mdy-terminal-v*-*.zip
