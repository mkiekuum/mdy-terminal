<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MDY Terminal</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
<header><strong id="mcpState" role="status">正在检查 MCP 连接</strong><button id="copyDom">复制 DOM</button></header>
<main>
  <section class="actions card" aria-label="计划操作"><button id="copyMcpPrompt" class="primary">MCP修改计划</button><button id="newPlanPrompt">MCP新建计划</button></section>
  <p id="message" role="status"></p>
  <nav class="actions"><button id="moreToggle" aria-expanded="false" aria-controls="moreDetails">设置</button></nav>
  <section id="moreDetails" class="card settings" aria-label="设置" hidden>
    <div class="setting-row">
      <span>记住密码 <small id="loginState"></small></span>
      <button id="editLogin" type="button" aria-expanded="false" aria-controls="loginSettings">设置</button>
    </div>
    <div id="loginSettings" class="login-fields" hidden>
      <label for="loginAccount">账号</label><input id="loginAccount" type="text" autocomplete="off" maxlength="100">
      <label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="new-password" maxlength="300">
      <div class="actions"><button id="rememberLogin" class="primary">保存</button><button id="forgetLogin">清除</button></div>
      <p id="loginStatus" class="hint" role="status"></p>
    </div>
    <div class="setting-row"><label for="hideSidebar">隐藏旧计划栏</label><input id="hideSidebar" type="checkbox"></div>
  </section>
</main>
<script type="module" src="ui.js"></script>
</body>
</html>
